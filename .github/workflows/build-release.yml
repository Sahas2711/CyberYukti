name: Build & Release

# Validation on PRs; full build + publish on every push to main.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXE_NAME: CyberYukti-Windows-x64
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # 1) validate — lint + tests + production web build (Linux)
  # ---------------------------------------------------------------------------
  validate:
    name: Validate & build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "httpx>=0.25.0" "python-dotenv>=1.0.0"

      - name: Run backend tests (pytest)
        run: python -m pytest backend/tests backend/app/ai/tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (npm ci)
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend (vitest)
        run: npm test
        working-directory: frontend

      - name: Production web build (static export)
        run: |
          rm -rf out .next
          BUILD_STATIC_EXPORT=true npm run build
          test -f out/index.html
          test -d out/_next
        working-directory: frontend

      - name: Upload web production build artifact (main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: web-production-build
          path: frontend/out/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2) exe — standalone Windows executable (windows-latest)
  # ---------------------------------------------------------------------------
  exe:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: validate
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "httpx>=0.25.0" "python-dotenv>=1.0.0" "pyinstaller>=6.22,<7"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static web UI (embedded into the EXE)
        shell: bash
        run: |
          cd frontend
          npm ci
          rm -rf out .next
          BUILD_STATIC_EXPORT=true NEXT_PUBLIC_USE_MOCK=true npm run build
          mkdir -p ../backend/static-ui
          cp -r out/* ../backend/static-ui/

      - name: Build metadata
        shell: bash
        run: |
          cat > backend/VERSION.json <<EOF
          {"version": "${{ github.ref_name }}", "commit_sha": "${GITHUB_SHA::7}", "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "environment": "windows-exe"}
          EOF
          cat backend/VERSION.json

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile --name "$EXE_NAME" \
            --paths . --paths backend --paths services \
            --add-data "backend/fixtures:backend/fixtures" \
            --add-data "backend/app/ai/prompts:backend/app/ai/prompts" \
            --add-data "backend/static-ui:backend/static-ui" \
            --add-data "backend/VERSION.json:backend" \
            --collect-submodules uvicorn --collect-submodules uvloop \
            --exclude-module openai --exclude-module anthropic \
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto \
            run_cyberyukti.py

      - name: Smoke test — launch EXE and verify HTTP responses
        shell: pwsh
        run: |
          $port = 8321
          $env:PORT = "$port"
          $proc = Start-Process -FilePath "dist/$env:EXE_NAME.exe" -WorkingDirectory "." -PassThru -NoNewWindow
          try {
            $ok = $false
            foreach ($i in 1..40) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "EXE exited early with code $($proc.ExitCode)" }
              try {
                $root = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 3
                $api  = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/cases" -UseBasicParsing -TimeoutSec 3
                if ($root.StatusCode -eq 200 -and $api.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "Smoke test failed: no 200 responses from EXE on port $port" }
            Write-Host "Smoke test OK: UI and API responded on port $port"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package EXE into zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:EXE_NAME.exe" -DestinationPath "dist/$env:EXE_NAME.zip" -Force
          Get-FileHash "dist/$env:EXE_NAME.zip" -Algorithm SHA256 | Format-List

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: dist/${{ env.EXE_NAME }}.zip
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) docker — ONE image for UI + API; publish to GHCR on main
  # ---------------------------------------------------------------------------
  docker:
    name: Build (and publish) Docker image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (main only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build image (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_COMMIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container — UI and API must respond (main only)
        if: github.event_name == 'push'
        run: |
          IMAGE="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "Testing image: $IMAGE"
          docker run -d --rm --name cyberyukti-test -p 8000:8000 "$IMAGE"
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS -o /dev/null http://127.0.0.1:8000/ && \
               curl -fsS -o /dev/null http://127.0.0.1:8000/api/cases; then
              ok=1; break
            fi
          done
          if [ "$ok" != "1" ]; then
            docker logs cyberyukti-test || true
            docker stop cyberyukti-test || true
            echo "Container smoke test failed" && exit 1
          fi
          echo "Container smoke test OK"
          docker logs cyberyukti-test | tail -5 || true
          docker stop cyberyukti-test

  # ---------------------------------------------------------------------------
  # 4) release — attach Windows EXE to GitHub Releases for version tags
  # ---------------------------------------------------------------------------
  release:
    name: Publish release artifacts
    runs-on: ubuntu-latest
    needs: [validate, exe, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download EXE artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: dist

      - name: Create GitHub Release with the Windows EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "CyberYukti $GITHUB_REF_NAME" \
            --notes "Standalone Windows build and container image for this release.

          - EXE: download CyberYukti-Windows-x64.zip, unzip, run CyberYukti-Windows-x64.exe, open http://localhost:8000
          - Docker: docker pull ghcr.io/${{ github.repository }}:$GITHUB_REF_NAME" \
            dist/*
