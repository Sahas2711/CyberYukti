name: Docker Image Generation & Docker Hub Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_REPO_NAME: cyberyukti

jobs:
  build-and-push:
    name: Build & Push Unified Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Target Names
        id: resolve_targets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          DH_REPO: ${{ secrets.DOCKERHUB_REPO || env.DEFAULT_REPO_NAME }}
        run: |
          # 1. GHCR image target (always enabled)
          GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          TARGETS="ghcr.io/${GHCR_REPO}"

          # 2. Docker Hub image target (if secrets are set)
          if [ -n "$DH_USER" ]; then
            DH_USER_LOWER=$(echo "$DH_USER" | tr '[:upper:]' '[:lower:]')
            DH_REPO_LOWER=$(echo "$DH_REPO" | tr '[:upper:]' '[:lower:]')
            DH_TARGET="${DH_USER_LOWER}/${DH_REPO_LOWER}"
            TARGETS="${TARGETS},${DH_TARGET}"
            echo "has_dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub Destination: ${DH_TARGET}"
          else
            echo "has_dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Notice: DOCKERHUB_USERNAME not set. Image will be published to GHCR."
          fi

          echo "targets=${TARGETS}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.resolve_targets.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.resolve_targets.outputs.targets }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and Push Single Unified Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Generation & Print Summary
        run: |
          echo "=========================================================="
          echo " Single Unified Docker Image Successfully Generated!      "
          echo "=========================================================="
          echo "Published Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"
          if [ "${{ steps.resolve_targets.outputs.has_dockerhub }}" = "true" ]; then
            echo "Status: Image uploaded to Docker Hub and GHCR!"
          else
            echo "Status: Image uploaded to GHCR."
            echo "To push to Docker Hub as well, add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub repository secrets."
          fi
          echo "=========================================================="
