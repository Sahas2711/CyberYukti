name: Docker Image Generation & Docker Hub Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_REPO_NAME: cyberyukti

jobs:
  build-and-push:
    name: Build & Push Unified Docker Image (Docker Hub & GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Target Names (Docker Hub & GHCR)
        id: resolve-targets
        run: |
          # 1. GitHub Container Registry target (always enabled)
          GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_LIST="ghcr.io/${GHCR_REPO}"

          # 2. Docker Hub target (enabled if secrets are present)
          DH_USER="${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}"
          DH_REPO="${{ secrets.DOCKERHUB_REPO || env.DEFAULT_REPO_NAME }}"

          if [ -n "$DH_USER" ]; then
            DH_USER_LOWER=$(echo "$DH_USER" | tr '[:upper:]' '[:lower:]')
            DH_REPO_LOWER=$(echo "$DH_REPO" | tr '[:upper:]' '[:lower:]')
            DH_TARGET="${DH_USER_LOWER}/${DH_REPO_LOWER}"
            IMAGE_LIST="${IMAGE_LIST}
${DH_TARGET}"
            echo "ENABLE_DOCKERHUB=true" >> $GITHUB_ENV
            echo "Docker Hub Destination: ${DH_TARGET}"
          else
            echo "ENABLE_DOCKERHUB=false" >> $GITHUB_ENV
            echo "Notice: DOCKERHUB_USERNAME secret not configured yet. Image will be published to GHCR."
          fi

          echo "IMAGE_TARGETS<<EOF" >> $GITHUB_ENV
          echo "$IMAGE_LIST" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.ENABLE_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_TARGETS }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and Push Single Unified Docker Image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker Generation & Print Summary
        run: |
          echo "=========================================================="
          echo " Single Unified Docker Image Successfully Generated!      "
          echo "=========================================================="
          echo "Published Tags:"
          echo "${{ steps.meta.outputs.tags }}"
          echo "Image Digest: ${{ steps.docker_build.outputs.digest }}"
          if [ "${{ env.ENABLE_DOCKERHUB }}" = "true" ]; then
            echo "Status: Image uploaded to Docker Hub and GHCR!"
          else
            echo "Status: Image uploaded to GHCR."
            echo "To push to Docker Hub as well, add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub repository secrets."
          fi
          echo "=========================================================="
